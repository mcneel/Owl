name: build

# Pushes and PRs build a 0.1.0-ci.<run> prerelease. Running the workflow by hand on main builds the
# plain version from owl/Owl.csproj and publishes it to nuget.org.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Required to pass before a PR can merge into main (set in the branch rules on GitHub).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      # Node first: the command-line tests export and serve the site.
      - name: Test the model and the owl command
        run: dotnet test owl.tests -c Release

      - name: Test the website
        run: node --test owl.tests/site/

  build:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      # LFS, or the package icon is packed as a pointer file rather than the image.
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build owl/Owl.csproj -c Release

      - name: Pack
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            dotnet pack owl/Owl.csproj -c Release --no-build -o nupkg
          else
            dotnet pack owl/Owl.csproj -c Release --no-build -o nupkg -p:VersionSuffix=ci.${{ github.run_number }}
          fi

      - name: Upload the package
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: owl-nupkg
          path: nupkg/*.nupkg
          retention-days: 90
          if-no-files-found: error

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: owl-nupkg

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      # --skip-duplicate makes a re-run harmless; bump VersionPrefix to publish a new version.
      - name: Push to nuget.org
        run: dotnet nuget push '*.nupkg' --skip-duplicate -s https://api.nuget.org/v3/index.json -k ${{ secrets.NUGET_API_KEY }}
