name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # LFS, or the package icon is packed as a pointer file rather than the image.
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build owl/Owl.csproj -c Release

      - name: Pack
        run: >
          dotnet pack owl/Owl.csproj -c Release
          -p:VersionSuffix=ci.${{ github.run_number }}
          -o nupkg

      - name: Upload the package
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: owl-nupkg
          path: nupkg/*.nupkg
          retention-days: 90
          if-no-files-found: error
